<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LMRT</title>
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <header class="bar">
    <h1>LMRT</h1>
    <div class="controls" role="toolbar" aria-label="Playback">
      <label class="button" for="file">Open file</label>
      <input id="file" class="visually-hidden" type="file">
      <button id="prev" type="button" disabled>Previous</button>
      <button id="toggle" type="button" disabled>Play</button>
      <button id="next" type="button" disabled>Next</button>
      <button id="stop" type="button" disabled>Stop</button>
      <label>Speed <input id="rate" type="range" min="0.5" max="3" step="0.1" value="1"> <output id="rate-out">1.0×</output></label>
      <label>Voice <select id="voice"></select></label>
    </div>
  </header>
  <p id="status" class="status" role="status" aria-live="polite">Open or drop a Markdown file to start.</p>
  <main id="doc" class="doc" tabindex="-1"></main>
  <script type="module" src="reader.js"></script>
</body>
</html>
